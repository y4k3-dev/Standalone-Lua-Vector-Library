name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Lua ${{ matrix.lua }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.2", "5.3", "5.4", "luajit-openresty"]

    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}

      # LuaRocks 3.12+ is needed for LuaJIT, older versions can't parse the luarocks.org manifest
      - uses: leafo/gh-actions-luarocks@v4
        with:
          luarocksVersion: "3.12.2"

      - name: Install busted
        run: luarocks install busted

      - name: Run tests
        run: busted tests

      - name: Run examples
        # LuaJIT installs its interpreter as luajit instead of lua
        run: |
          LUA=$(command -v lua || command -v luajit)
          for example in examples/*_example.lua; do
              "$LUA" "$example"
          done
